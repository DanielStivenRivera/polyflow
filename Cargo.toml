[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` at the root launches the app.
default-members = ["crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanielStivenRivera/polyflow"
authors = ["Polyflow contributors"]

[workspace.dependencies]
polyflow-core = { path = "crates/core" }
polyflow-spatial = { path = "crates/spatial" }
polyflow-io = { path = "crates/io" }
polyflow-bake = { path = "crates/bake" }
polyflow-render = { path = "crates/render" }

glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
winit = "0.30"
egui = "0.36"
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-ash-renderer = { version = "0.13", features = ["gpu-allocator"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
rayon = "1.12"
fast-float2 = "0.2"
memchr = "2"
rfd = "0.17"
meshopt = "0.7"
png = "0.18"
exr = "1.74"
# Bit-exact port of the MikkTSpace reference; its fixes for reference bugs
# stay off so tangents match what engines compute.
bevy_mikktspace = "1.0"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
dirs = "7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Mesh processing is unusable at opt-level 0; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# Release speed with debug info, for Tracy / perf / VTune.
[profile.profiling]
inherits = "release"
debug = true
